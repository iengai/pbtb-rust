[package]
name = "pbtb-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-sdk-dynamodb = "1"
aws-config = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.4", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
config = "0.13"
teloxide = { version = "0.12", default-features = false, features = ["macros", "rustls", "ctrlc_handler"] }
anyhow = "1.0.99"
log = "0.4"
aws-sdk-s3 = "1.108.0"
lambda_runtime = "1.0.1"
aws_lambda_events = "1.0.1"
aws-sdk-ecs = "1.108.0"
tracing = "0.1.41"
# Already in the tree via lambda_runtime; named directly because mcp_stdio needs
# a subscriber on stderr — stdout is the MCP protocol stream.
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Error events to Sentry through the tracing layer (src/observability.rs); the
# client only exists when APP__SENTRY__DSN is set. Default features are off
# because `transport` selects native-tls, and the lambda-export builder has no
# OpenSSL — everything in this tree is rustls.
sentry = { version = "0.49", default-features = false, features = [
    "backtrace",
    "contexts",
    "panic",
    "tracing",
    "reqwest",
    "rustls",
] }
thiserror = "1"
# Bybit V5 REST client for the return-curve collector bin. rustls (not OpenSSL)
# keeps the lambda-export build free of system TLS deps; reqwest is already in
# the tree via teloxide's rustls stack, so this only pins/exposes it directly.
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
# Official MCP SDK, targeting the 2026-07-28 revision: the JSON-RPC envelope,
# the schema types, protocol-version negotiation and the stdio transport. The
# alternative is hand-rolling protocol framing, which is exactly the kind of
# code a vetted implementation should own.
rmcp = { version = "3", features = [
    "server",
    "macros",
    "schemars",
    "transport-io",
    "transport-streamable-http-server",
] }
schemars = "1"
# Turns a Function URL's API-Gateway-shaped event into an `http::Request` and a
# response back again, which is the whole of what the mcp_http bin needs on top
# of rmcp: rmcp's streamable-HTTP transport is already an `http::Request`
# handler, so the two meet without a hand-written payload parser.
lambda_http = "0.13"
# The http type vocabulary the rmcp transport and lambda_http meet in.
http = "1"
bytes = "1"
http-body-util = "0.1"
# JWT signature verification and JWKS parsing for the OAuth transport. Not
# hand-rolled: signature checks, algorithm confusion and base64url framing are
# exactly where a bespoke implementation goes quietly wrong.
jsonwebtoken = "9"
# base64url for the PKCE challenge, whose encoding RFC 7636 fixes; hex will not
# do there. Percent-encoding for the authorization URL and its callback's query.
base64 = "0.22"
form_urlencoded = "1"
# The OS random source, for link tokens and the PKCE verifier.
getrandom = "0.4"
# Constant-time byte comparison for the MCP bearer. Already in the tree under
# the TLS stack; named directly rather than hand-rolling the compare.
subtle = "2"
# Reads the MCP bearer at cold start. The token stays a SecureString that
# Terraform never holds the value of, the way the telegram token does.
aws-sdk-ssm = "1"

[dev-dependencies]
tokio-test = "0.4"
# Stand-in Telegram Bot API for the end-to-end tests: teloxide is pointed at it
# with `Bot::set_api_url`, so handlers make real HTTP calls that the test can
# assert on instead of reaching api.telegram.org.
wiremock = "0.6"
testcontainers = "0.24"
# Mints the tokens the OAuth tests present, with the same crate that verifies
# them — a bespoke signer would be testing the test, not the verifier.
jsonwebtoken = "9"
aws-credential-types = "1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[[bin]]
name = "mcp_stdio"
path = "src/bin/mcp_stdio/main.rs"

[[bin]]
name = "mcp_http"
path = "src/bin/mcp_http/main.rs"

[[bin]]
name = "task_state_change_handler"
path = "src/bin/task_state_change_handler/main.rs"

[[bin]]
name = "daily_pnl_snapshot"
path = "src/bin/daily_pnl_snapshot/main.rs"
