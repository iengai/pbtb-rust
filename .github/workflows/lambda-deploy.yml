name: lambda-deploy

# Build a Lambda bootstrap and ship it straight to the function via `aws lambda
# update-function-code`. No Terraform — so this never touches the env S3 state,
# the backend lock, or the NAT lifecycle. The function's config/wiring stays
# Terraform-owned; only the code is shipped here (the function ignores
# source_code_hash drift; see terraform/modules/lambda/base).
#
# The binary is built through the SAME builder stage the devcontainer/telebot use
# (.devcontainer/Dockerfile, FROM rust:1.89-bookworm), which references no symbol
# above GLIBC_2.34 — exactly the glibc AL2023 ships. A plain `cargo build` on the
# ubuntu-24.04 runner links against glibc 2.39 and could fail on the Lambda host.
#
# Manual only: every target here can act on live bots, so deploys are deliberate
# (mirrors telebot-deploy).

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which lambda to deploy'
        type: choice
        default: task-state-change-handler
        options:
          - task-state-change-handler
          - mcp-http
      publish:
        description: 'Publish an immutable Lambda version for rollback'
        type: boolean
        default: true

permissions:
  id-token: write   # OIDC -> assume the lambda-deploy role
  contents: read

env:
  AWS_REGION: ap-northeast-1

jobs:
  deploy:
    # x86_64 host matches the function arch (x86_64); the builder image builds
    # linux/amd64 natively, no QEMU.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Mirrors terraform's "${project}-${env}-${function_name}" (project=scalable-cluster,
      # env=dev). Keep in sync with terraform if the project/env or a function name
      # is renamed, or update-function-code 404s.
      - name: Resolve the target
        run: |
          set -euo pipefail
          case "${{ github.event.inputs.target }}" in
            mcp-http)
              echo "FUNCTION_NAME=scalable-cluster-dev-mcp-http" >> "$GITHUB_ENV"
              echo "BIN_NAME=mcp_http" >> "$GITHUB_ENV"
              ;;
            *)
              echo "FUNCTION_NAME=scalable-cluster-dev-task-state-change-handler" >> "$GITHUB_ENV"
              echo "BIN_NAME=task_state_change_handler" >> "$GITHUB_ENV"
              ;;
          esac

      - uses: docker/setup-buildx-action@v3

      # Persist cargo registry + target across runs so only changed crates recompile.
      - name: Restore cargo build cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            cargo-registry-cache
            cargo-target-cache
          key: lambda-buildkit-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            lambda-buildkit-

      - name: Inject cargo cache into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {
              "cargo-registry-cache": "/usr/local/cargo/registry",
              "cargo-target-cache": "/app/target"
            }
          skip-extraction: ${{ steps.cache.outputs.cache-hit }}

      # The lambda-export stage is FROM scratch with just /bootstrap; type=local
      # writes it to ./artifact/bootstrap.
      - name: Build bootstrap (devcontainer builder stage)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          target: lambda-export
          platforms: linux/amd64
          build-args: |
            BIN_NAME=${{ env.BIN_NAME }}
          outputs: type=local,dest=artifact
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Package zip (bootstrap at root)
        run: |
          set -euo pipefail
          test -f artifact/bootstrap || { echo "bootstrap not produced by the build"; exit 1; }
          # AL2023 ships glibc 2.34. A bootstrap linked against anything newer
          # builds and packages cleanly and fails only on the first invocation,
          # so the builder image's glibc is checked here rather than trusted.
          MAX=$(readelf --version-info artifact/bootstrap | grep -oE 'GLIBC_2\.[0-9]+' | sort -V | tail -1)
          echo "max required glibc symbol: ${MAX:-none}"
          if [ -n "$MAX" ] && [ "$(printf '%s\nGLIBC_2.34\n' "$MAX" | sort -V | tail -1)" != "GLIBC_2.34" ]; then
            echo "bootstrap requires $MAX, newer than AL2023's GLIBC_2.34"; exit 1
          fi
          chmod +x artifact/bootstrap
          (cd artifact && zip -X -q ../out.zip bootstrap)
          echo "LOCAL_SHA=$(openssl dgst -sha256 -binary out.zip | base64)" >> "$GITHUB_ENV"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_LAMBDA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update function code
        id: update
        run: |
          set -euo pipefail
          PUBLISH=''
          [ "${{ github.event.inputs.publish }}" = "true" ] && PUBLISH='--publish'
          OUT=$(aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://out.zip \
            $PUBLISH \
            --output json)
          echo "$OUT" | jq '{FunctionArn, Version, CodeSha256, LastUpdateStatus}'
          echo "remote_sha=$(echo "$OUT" | jq -r '.CodeSha256')" >> "$GITHUB_OUTPUT"

      - name: Wait for the update to settle
        run: aws lambda wait function-updated --function-name "$FUNCTION_NAME"

      - name: Verify CodeSha256
        run: |
          set -euo pipefail
          echo "local : $LOCAL_SHA"
          echo "remote: ${{ steps.update.outputs.remote_sha }}"
          [ "$LOCAL_SHA" = "${{ steps.update.outputs.remote_sha }}" ] \
            || { echo "CodeSha256 mismatch (upload corrupted?)"; exit 1; }

      # Neither payload can act on a bot. The task-state event is a benign
      # non-aws.ecs one, which hits the source/detail-type guard in
      # event_handler.rs and returns before any ECS or DynamoDB call — NEVER
      # smoke-test that function with a real STOPPED event. The MCP payload
      # carries no bearer, so it is refused at the edge; a 401 is the pass.
      - name: Smoke invoke
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.target }}" = "mcp-http" ]; then
            PAYLOAD='{"version":"2.0","rawPath":"/","requestContext":{"http":{"method":"POST","path":"/"}},"headers":{"content-type":"application/json"},"body":"{}","isBase64Encoded":false}'
          else
            PAYLOAD='{"version":"0","source":"pbtb.smoke-test","detail-type":"SmokeTest","detail":{}}'
          fi
          # AWS CLI v2 exits non-zero when the response carries a FunctionError;
          # tolerate it so the explicit StatusCode/FunctionError checks below run
          # (and print response.json) instead of set -e aborting with a raw exit.
          RESP=$(aws lambda invoke \
            --function-name "$FUNCTION_NAME" \
            --cli-binary-format raw-in-base64-out \
            --payload "$PAYLOAD" \
            --output json \
            response.json) || true
          echo "$RESP"
          echo "body: $(cat response.json 2>/dev/null || true)"
          STATUS=$(echo "$RESP" | jq -r '.StatusCode')
          FERR=$(echo "$RESP" | jq -r '.FunctionError // "None"')
          [ "$STATUS" = "200" ] || { echo "unexpected StatusCode=$STATUS"; exit 1; }
          [ "$FERR" = "None" ] || { echo "FunctionError: $FERR"; cat response.json; exit 1; }
          if [ "${{ github.event.inputs.target }}" = "mcp-http" ]; then
            CODE=$(jq -r '.statusCode' response.json)
            [ "$CODE" = "401" ] || { echo "an unauthenticated request returned $CODE, not 401"; exit 1; }
          fi
          echo "smoke ok"

      - name: Summary
        run: |
          {
            echo "### Lambda deployed"
            echo "- target: \`${{ github.event.inputs.target }}\`"
            echo "- function: \`$FUNCTION_NAME\`"
            echo "- CodeSha256: \`${{ steps.update.outputs.remote_sha }}\`"
            echo "- published version: \`$([ "${{ github.event.inputs.publish }}" = "true" ] && echo yes || echo no)\`"
          } >> "$GITHUB_STEP_SUMMARY"
