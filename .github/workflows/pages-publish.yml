name: pages-publish

# Build the static console (site/) and publish it to GitHub Pages. The page is
# code and the committed template backtests. The showcase is not in it: the
# pages read it at run time from the showcase CDN (VITE_SHOWCASE_URL,
# terraform/envs/dev/showcase-cdn.tf), which the showcase switch and the daily
# collector keep current. A tenant's own curves reach the browser through the
# API after sign-in.
#
# Runs on a push touching the site and on dispatch.
#
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages-publish.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write # deploy to GitHub Pages
  id-token: write # deploy-pages authenticates with an OIDC token

# Never run two publishes at once (they race on the Pages deployment).
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      # The console is a Vite build; `site/templates/` is copied into `dist/`
      # by the build. The four values are public identifiers (the API's URL,
      # the showcase CDN, the issuer, a public OAuth client id), not secrets —
      # see site/README.md.
      - name: Build the console
        working-directory: site
        env:
          VITE_API_URL: https://wpgsvdyyl6rb4omtrgb7ox6weu0krirm.lambda-url.ap-northeast-1.on.aws/
          VITE_SHOWCASE_URL: https://d1rxu490g9jchv.cloudfront.net/
          VITE_OAUTH_ISSUER: https://growing-starlight-99-staging.authkit.app
          VITE_OAUTH_CLIENT_ID: client_01M227S251T5NA8GTGHWT1QAVB
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -f dist/templates/index.json
          test -f dist/404.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

      - id: deploy
        uses: actions/deploy-pages@v5
