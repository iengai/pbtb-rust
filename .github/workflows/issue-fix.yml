name: issue-fix

# Open a fix PR for one issue at its "open a PR" tier. scripts/ops/fix_issue.py
# drives an OpenAI-compatible chat model on a clean checkout of main with
# write tools bounded to the checkout (a deny list keeps workflows,
# terraform, hooks, the scripts behind these workflows, .git, .cargo, build
# scripts, dependency manifests, AGENTS.md and REVIEW.md human-owned) and a
# whitelist of cargo / gate commands. A change under src/ or tests/ becomes
# a PR only after a `cargo test` was seen failing and the same command then
# passing, and any change only after the same gate CI runs is green. The PR
# body carries the gate lines, the red→green evidence and a REVIEW.md pass by
# the same model. At a merge tier, and only while the ruleset on main
# requires the `gate` check, the PR is armed to merge itself when that
# check passes; otherwise a person merges. Nothing here deploys, and
# neither job has AWS credentials.
#
# Two jobs, because the model's test code executes in the first: `fix` holds
# a read-only token and the model key, keeps no credentials in the checkout,
# runs the model's commands without even those, and hands over a patch and
# a result file as an artifact; `publish` holds the write token, runs no
# model code, and turns the result into a comment or a branch + PR; it
# takes nothing that decides a merge from the artifact (the tier is read
# from the issue again, the paths re-checked, the check is CI's). The
# model keys reach the model's process through a file it deletes on reading
# and the token leaves its environment before the loop, so a hostile test
# in `fix` finds a public repo and the runner, nothing that outlives the run.
#
# Starts when the `agent:fix` label lands on an issue (only triage access
# and above can label, so the label is the authorization, whoever wrote the
# issue) and its "How far the agent may go" field grants a PR (the field,
# not the label, is what fix_issue.py checks), or by dispatch with an issue
# number.
#
# Setup shared with incident-diagnose: variables LLM_BASE_URL, LLM_MODEL
# (and the LLM_FALLBACK_* pair), secret LLM_API_KEY. For the merge tiers
# "Allow auto-merge" and "Automatically delete head branches" (Settings →
# General → Pull Requests) and the ruleset on main requiring `gate`.
#
# Whose token `publish` holds decides how far a merge tier goes. Secret
# FIX_PUBLISH_TOKEN, a fine-grained token of a member scoped to this
# repository (Contents, Pull requests, Issues: read and write; Metadata),
# makes the PR that member's: its pull_request run executes, and a merge
# auto-merge performs closes the issue, deletes the branch and raises the
# push run on main. Without it the repository token publishes, which needs
# "Allow GitHub Actions to create and approve pull requests" (Settings →
# Actions → General); the PR's own verify run then waits for a
# maintainer's approval (the bot counts as an outside contributor), so
# fix_issue.py also dispatches verify on the branch for a readable result,
# auto-merge waits for that approval, and the merge it performs closes no
# issue and deletes no branch (GitHub runs nothing on the repository
# token's own actions); the PR comment says what is left for a person.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: The issue to fix
        type: number
        required: true
      dry_run:
        description: Run the model and the gate, print the PR in the log; do not push, open or comment
        type: boolean
        default: false

env:
  ISSUE: ${{ github.event.inputs.issue_number || github.event.issue.number }}

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'agent:fix'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    # One fix attempt per issue at a time; a second trigger waits its turn.
    concurrency:
      group: issue-fix-${{ github.event.inputs.issue_number || github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git log is one of the model's tools; the gate diffs against main
          ref: main
          persist-credentials: false

      # The toolchain steps mirror verify.yml so the gate the model runs is
      # the gate CI runs.
      - uses: dtolnay/rust-toolchain@1.89
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # Restores the cache verify's run on main saved; nothing built
          # here is worth keeping, and this job's ref is main.
          shared-key: gate
          save-if: "false"

      - run: sudo apt-get update && sudo apt-get install -y nasm

      # No terraform: the gate's terraform checks run only for a change under
      # terraform/, which the deny list refuses, and `terraform init` would
      # rewrite the tracked provider lock on this platform before the model
      # starts.
      - run: docker info > /dev/null

      # The keys reach the model's process through a file it deletes on
      # reading, not through its environment: /proc/<pid>/environ shows a
      # child the environment its parent started with, and the model's tests
      # are that child.
      - name: Stage the model keys
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_FALLBACK_API_KEY: ${{ secrets.LLM_FALLBACK_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n%s\n' "$LLM_API_KEY" "$LLM_FALLBACK_API_KEY" > "$RUNNER_TEMP/llm-keys"

      - name: Fix
        env:
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_FALLBACK_BASE_URL: ${{ vars.LLM_FALLBACK_BASE_URL }}
          LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL }}
          LLM_KEYS_FILE: ${{ runner.temp }}/llm-keys
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          args=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then args="--dry-run"; fi
          python3 scripts/ops/fix_issue.py run --issue "$ISSUE" --out "$RUNNER_TEMP/fix" $args

      - uses: actions/upload-artifact@v4
        with:
          name: fix-${{ env.ISSUE }}
          path: ${{ runner.temp }}/fix
          retention-days: 7

  publish:
    needs: fix
    if: github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: fix-${{ env.ISSUE }}
          path: ${{ runner.temp }}/fix

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.FIX_PUBLISH_TOKEN || github.token }}
          PUBLISH_AS: ${{ secrets.FIX_PUBLISH_TOKEN && 'person' || 'bot' }}
          GH_REPO: ${{ github.repository }}
          FIX_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/ops/fix_issue.py publish --issue "$ISSUE" --in "$RUNNER_TEMP/fix"
