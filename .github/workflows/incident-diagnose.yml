name: incident-diagnose

# Post a read-only diagnosis on an Incident issue. scripts/ops/diagnose_issue.py
# runs Claude Code headless on this checkout (the harness this repository is
# written for, against the model the Anthropic-compatible endpoint serves:
# DeepSeek's deepseek-flash by default) with the pbtb-triage skill as its
# loop and a read-only surface its own hook enforces: Read / Grep / Glob
# inside the checkout, git log / show / blame, the read subcommands of
# pbtb_ops.py and the Sentry issue lookup; no edits, no web, no subagents.
# The AWS side is bounded by the gh-diagnose role in
# terraform/envs/dev/diagnose-ci.tf: describe and read-log calls only, bot
# rows without their key attributes, no SSM. Those credentials sit in the
# harness's environment for pbtb_ops.py; the model reaches them through
# nothing but that script. The GitHub token never enters the harness.
#
# Two ways in. A person opening or labelling an issue `incident` runs it
# when they have write access to the repo, and so does the local agent
# App whose user id is the repository variable LOCAL_AGENT_USER_ID (an
# outsider's issue does not start it). The incident-intake workflow files its issues with the
# repository token, which raises no `issues` event by design, so it
# dispatches this workflow by number instead.
#
# A diagnosis that ends "Self-evident: yes" on an issue the intake filed
# raises that issue to the "open a PR" tier and dispatches issue-fix; an
# issue a person filed keeps the tier the person chose.
#
# One-time setup, shared with issue-fix: secret LLM_API_KEY (the DeepSeek
# key, handed to Claude Code as ANTHROPIC_API_KEY), variable LLM_MODEL
# (deepseek-flash when unset) and, for another Anthropic-compatible
# endpoint, variable LLM_ANTHROPIC_BASE_URL. Own to this workflow: secret
# AWS_DIAGNOSE_ROLE_ARN (terraform output gh_diagnose_role_arn);
# SENTRY_AUTH_TOKEN is shared with incident-intake.

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: The issue to diagnose
        type: number
        required: true
      dry_run:
        description: Print the comment in the log instead of posting it
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  id-token: write
  actions: write # dispatches issue-fix when a diagnosis is self-evident

env:
  AWS_REGION: ap-northeast-1
  ISSUE: ${{ github.event.inputs.issue_number || github.event.issue.number }}

jobs:
  diagnose:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.issue.labels.*.name, 'incident') &&
       (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) ||
        (vars.LOCAL_AGENT_USER_ID != '' && format('{0}', github.event.issue.user.id) == vars.LOCAL_AGENT_USER_ID)))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # One diagnosis per issue at a time; a second trigger waits its turn.
    concurrency:
      group: incident-diagnose-${{ github.event.inputs.issue_number || github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git log is one of the model's tools
          persist-credentials: false

      # The role trusts main only (diagnose-ci.tf); a dry run dispatched on a
      # branch tries the harness without the AWS side, and its ops probes
      # answer with the missing credentials.
      - name: Configure AWS credentials (OIDC, read-only role)
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DIAGNOSE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The harness. Pinned to the version issue-fix pins, so a release does
      # not change what a run can do between one issue and the next.
      - run: npm install -g @anthropic-ai/claude-code@2.1.263

      - name: Diagnose
        env:
          ANTHROPIC_BASE_URL: ${{ vars.LLM_ANTHROPIC_BASE_URL || 'https://api.deepseek.com/anthropic' }}
          ANTHROPIC_API_KEY: ${{ secrets.LLM_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.LLM_MODEL || 'deepseek-flash' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DIAGNOSE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # pbtb_ops.py addresses AWS through a named profile on a workstation;
          # here the OIDC credentials are in the environment and no profile exists.
          PBTB_AWS_PROFILE: ""
        run: |
          set -euo pipefail
          args=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then args="--dry-run"; fi
          python3 scripts/ops/diagnose_issue.py run --issue "$ISSUE" --out "$RUNNER_TEMP/diagnose" $args

      # What the harness did, for a run that needs reading: every command the
      # hook saw with its exit code, and the settings it ran under. The
      # outputs the model read stay out of the artifact.
      - name: Harness trail
        if: always()
        run: |
          f="$RUNNER_TEMP/diagnose/runs.jsonl"
          [ -f "$f" ] && { jq -r '"\(.rc // "-")\t\(.cmd[0:200] | gsub("\n"; " "))"' "$f" || true; }
          f="$RUNNER_TEMP/diagnose/claude-settings.json"
          [ -f "$f" ] && cat "$f"
          true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnose-${{ env.ISSUE }}
          path: ${{ runner.temp }}/diagnose
          retention-days: 7
